name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: macos-latest  # Apple Silicon: MLX has no Linux wheels without extras
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q  # no model download: the scorer tests use a fake tokenizer
